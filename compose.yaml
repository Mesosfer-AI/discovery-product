services:
  frontend:
    build:
      context: ./fe-ai-lablab
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-}
    ports:
      - "${APP_PORT:-47281}:47281"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:47281/up"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build: ./be-ai-lablab
    env_file:
      - path: ./.env
        required: false
    environment:
      APP_NAME: ${APP_NAME:-Mesosfer}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:47281}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-mesosfer}
      DB_USERNAME: ${DB_USERNAME:-mesosfer}
      DB_PASSWORD: ${DB_PASSWORD:-}
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
      CACHE_STORE: ${CACHE_STORE:-file}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-6379}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:47283}
      AI_SERVICE_TIMEOUT: ${AI_SERVICE_TIMEOUT:-180}
    volumes:
      - backend_storage:/var/www/html/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ai:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 47282) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  ai:
    build: ./ai
    env_file:
      - path: ./.env
        required: false
    environment:
      REDIS_URL: ${REDIS_URL:-redis://host.docker.internal:6379/0}
      DEBUG: ${DEBUG:-false}
    shm_size: "512m"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:47283/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  backend_storage:


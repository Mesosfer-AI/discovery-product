services:
  frontend:
    build: ./fe-ai-lablab
    ports:
      - "${APP_PORT:-47281}:47281"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:47281/up"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build: ./be-ai-lablab
    environment:
      APP_NAME: Mesosfer
      APP_ENV: production
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:47281}
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: "47284"
      DB_DATABASE: ${DB_DATABASE:-mesosfer}
      DB_USERNAME: ${DB_USERNAME:-mesosfer}
      DB_PASSWORD: ${DB_PASSWORD:-mesosfer_local}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      REDIS_HOST: redis
      REDIS_PORT: "47285"
      AI_SERVICE_URL: http://ai:47283
      AI_SERVICE_TIMEOUT: "180"
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      database:
        condition: service_healthy
      ai:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 47282) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  ai:
    build: ./ai
    env_file:
      - path: ./ai/.env
        required: false
    environment:
      REDIS_URL: redis://redis:47285/0
      DEBUG: "false"
    shm_size: "512m"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:47283/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  database:
    image: mysql:8.4
    command: ["--port=47284", "--mysqlx=0"]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-mesosfer}
      MYSQL_USER: ${DB_USERNAME:-mesosfer}
      MYSQL_PASSWORD: ${DB_PASSWORD:-mesosfer_local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-mesosfer_root_local}
    volumes:
      - database:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -P 47284 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--port", "47285", "--appendonly", "yes"]
    volumes:
      - redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "47285", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  database:
  redis:
  backend_storage:

